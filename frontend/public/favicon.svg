<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="khanagoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#dc2626" />
    </linearGradient>
  </defs>

  <!-- Rounded orange gradient background -->
  <rect width="64" height="64" rx="14" ry="14" fill="url(#khanagoGrad)" />

  <!-- Fork + knife icon -->
  <g transform="translate(32 32)">
    <!-- Fork (left) -->
    <g transform="translate(-7 0)">
      <path
        d="M -3 -14 L -3 -6 M 0 -14 L 0 -6 M 3 -14 L 3 -6"
        stroke="#ffffff"
        stroke-width="2.2"
        stroke-linecap="round"
        fill="none"
      />
      <path
        d="M -3 -6 Q 0 -2 3 -6 L 3 14"
        stroke="#ffffff"
        stroke-width="2.2"
        stroke-linecap="round"
        stroke-linejoin="round"
        fill="none"
      />
    </g>

    <!-- Knife (right) -->
    <g transform="translate(7 0)">
      <path
        d="M -3 -14 L -3 14"
        stroke="#ffffff"
        stroke-width="2.2"
        stroke-linecap="round"
        fill="none"
      />
      <path
        d="M -3 -14 Q 4 -12 4 -4 Q 4 2 -3 2"
        stroke="#ffffff"
        stroke-width="2.2"
        stroke-linecap="round"
        stroke-linejoin="round"
        fill="none"
      />
    </g>
  </g>

  <!-- Small yellow dot (top-right sparkle) -->
  <circle cx="52" cy="12" r="3" fill="#fde047" stroke="#ffffff" stroke-width="1.5" />
</svg>